env_profiles:
  qwen_replay_vlmeval:
    python: '{conda_root}/envs/vlmeval031/bin/python'
    pythonpath:
    - '{repo_root}'
    base_env:
      LMUData: '{lmu_data}'
      OMP_NUM_THREADS: '1'
      FORCE_LOCAL: 'True'
      OLD_VERSION: 'False'
      PYTHONNOUSERSITE: '1'
      VLMEVAL_API_MINIMAL_IMPORT: '1'
      VLMEVAL_VLM_MINIMAL_IMPORT: '1'
      VLMEVAL_LAZY_INIT: '1'
      VLMEVAL_USE_QWEN_MINIMAL_CONFIG: '1'
      QWEN35_NONTHINK_SAMPLING: greedy
  gemma4_replay_vlmeval:
    python: '{conda_root}/envs/vlmeval031/bin/python'
    pythonpath:
    - '{repo_root}'
    base_env:
      LMUData: '{lmu_data}'
      OMP_NUM_THREADS: '1'
      FORCE_LOCAL: 'True'
      OLD_VERSION: 'False'
      PYTHONNOUSERSITE: '1'
      VLMEVAL_USE_GEMMA4_MINIMAL_CONFIG: '1'
      VLMEVAL_API_MINIMAL_IMPORT: '1'
      VLMEVAL_VLM_MINIMAL_IMPORT: '1'
      VLMEVAL_LAZY_INIT: '1'
      GEMMA4_USE_VLLM: '1'
models:
  qwen38_27b:
    display_name: Qwen3.8-27B
    registry_name: Qwen3.8-27B-Replay
    env_profile: qwen_replay_vlmeval
    model_path: '{model_root}/Qwen3.8-27B'
    runtime:
      gpus_per_job: 2
      infer_batch_size: 128
      max_num_seqs: 128
      tp_size: 2
      max_model_len: 40960
      estimated_dataset_cost: 1.0
