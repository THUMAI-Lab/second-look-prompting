name: paper-tvt-minicpm
results_root: '{repo_root}/results/paper-tvt-minicpm'
node_gpu_ids: 2,3,4,5,6,7
scheduler: gpu_pool
datasets:
- DynaMath
- MathVision
- LogicVista
- VisualPuzzles
- MMMU_DEV_VAL_SINGLE_IMAGE
- MathVista_MINI
- WeMath
- AI2D_TEST
- OCRBench
- SEEDBench2_Plus
- MMBench_DEV_EN_V11
- MMStar
policies:
  default:
    replay_prompt_template_name: identity
replay_modes:
- text_image_text
image_transforms:
- baseline
models:
- minicpmo45
replay:
  replay_times: 1
  template_on_last_replay_text: 1
  image_copy_mode: reuse_path
  limit_mm_per_prompt: 4
  safe_fallback: 0
  safe_truncate_chars: 6000
  stage_debug: 1
  stage_debug_samples: 1
  prompt_audit: 1
  prompt_audit_print: 0
trace:
  level: summary
  samples: 1
  dump_max_chars: 12000
  prompt_audit_print: 0
answer_format:
  enable: 1
  require_boxed: 0
  response_col: prediction
  fallback_col: detailed_prediction
  max_fails: 50
evaluation:
  launch_mode: bg
  judge: gpt-4o-mini
  nproc: 512
worker_monitor:
  enable: true
  interval_seconds: 600
resume_infer_default: false
resume_infer_start_delay_seconds: 10
