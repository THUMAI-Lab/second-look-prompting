env_profiles:
  venv017:
    python: '{conda_root}/envs/vlmeval017/bin/python'
    pythonpath:
    - '{repo_root}'
    base_env:
      LMUData: '{lmu_data}'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      FORCE_LOCAL: 'True'
      OLD_VERSION: 'False'
      PYTHONNOUSERSITE: '1'
      VLMEVAL_API_MINIMAL_IMPORT: '1'
      VLMEVAL_VLM_MINIMAL_IMPORT: '1'
      VLMEVAL_LAZY_INIT: '1'
      REPLAY_TEXT_FILLER_TYPE: dots
models:
  qwen25vl_32b:
    display_name: Qwen2.5-VL-32B
    registry_name: Qwen2VLChatReplay
    env_profile: venv017
    model_path: '{model_root}/Qwen2.5-VL-32B-Instruct'
    runtime:
      gpus_per_job: 2
      infer_batch_size: 16
      max_num_seqs: 16
      tp_size: 2
      max_model_len: 32768
      estimated_dataset_cost: 3.0
    task_env:
      VLMEVAL_USE_QWEN_MINIMAL_CONFIG: '1'
      MODEL_PATH_QWEN25_32B: '{model_root}/Qwen2.5-VL-32B-Instruct'
